{% extends "base.html" %}
{% block content %}
<h2>Вход</h2>
<form method="post">
  {{ form.hidden_tag() }}
  <p>{{ form.email.label }}<br>{{ form.email }}</p>
  <p>{{ form.password.label }}<br>{{ form.password }}</p>
  <p>{{ form.submit }}</p>
</form>
<p><a href="{{ url_for('register') }}">Регистрация</a></p>
{% endblock %}
