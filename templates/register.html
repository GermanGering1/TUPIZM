{% extends "base.html" %}
{% block content %}
<h2>Регистрация</h2>
<form method="post">
  {{ form.hidden_tag() }}
  <p>{{ form.email.label }}<br>{{ form.email }}</p>
  <p>{{ form.nickname.label }}<br>{{ form.nickname }}</p>
  <p>{{ form.password.label }}<br>{{ form.password }}</p>
  <p>{{ form.submit }}</p>
</form>
<p><a href="{{ url_for('login') }}">Уже есть аккаунт?</a></p>
{% endblock %}
